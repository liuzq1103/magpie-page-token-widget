name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check the syntax of every source file
        run: npm run check:syntax

      - name: Run the tests
        run: npm test

      - name: Pack the plugin
        run: npm pack --dry-run

      - name: Look for whitespace errors
        run: git diff --check
