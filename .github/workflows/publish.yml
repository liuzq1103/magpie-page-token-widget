name: publish

# The package is published with the identity of GitHub Actions itself: npm
# calls it a trusted publisher, and it needs no token at all. The name of this
# file is the name that is written down in the settings of the package on
# npmjs.com, so the two have to stay the same, letter by letter.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag that is published
        required: true

# The two jobs do not trust each other. The first one reads the code and says
# whether it may be published; the second one publishes the package that was
# packed by the first one and runs no code of the repository at all. Only the
# second one holds the OIDC token, and the code of the release never gets to
# touch it.
jobs:
  verify:
    name: check the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The rules of the release are read from the main branch, not from the
      # tag: a tag may carry another workflow and another set of rules.
      - name: Take the repository and its whole history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.repository.default_branch }}

      # The same Node as the one that publishes, so that the tests run on the
      # version the package is packed with and not on whatever the image of
      # the runner happens to carry.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - id: guard
        name: The release has to be a tag on the main branch, with the version of the package
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          # A release names its own commit; a manual run does not, and then
          # the tag alone says which commit is meant.
          EXPECT_SHA: ${{ github.event_name == 'release' && github.sha || '' }}
          # The run may come from the tag; the workflow of the run has to be
          # the one of the main branch.
          WORKFLOW_REF: ${{ github.workflow_ref }}
          # The branch the release has to be on. It is named here, so that
          # the rules and the checkout cannot drift apart.
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          workflow_ref="${WORKFLOW_REF#*@}"
          node scripts/verify-release.mjs \
            --tag "$TAG" \
            --expect-sha "$EXPECT_SHA" \
            --workflow-ref "$workflow_ref" \
            --base "$BASE"

      - name: Take the commit of the tag
        env:
          COMMIT: ${{ steps.guard.outputs.commit }}
        run: git checkout --detach "$COMMIT"

      - name: Check the syntax of every source file
        run: npm run check:syntax

      - name: Run the tests
        run: npm test

      - name: Pack the package
        id: pack
        run: |
          mkdir -p dist
          name="$(npm pack --pack-destination dist --silent | tail -n 1)"
          if [ ! -f "dist/$name" ]; then
            echo "the package was not packed" >&2
            exit 1
          fi
          echo "tarball=dist/$name" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Hand the package over to the job that publishes it
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.tgz
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: verify
    # A pre-release is not published to npm: npm would make it the version
    # everybody gets. The guard refuses such a tag as well.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token comes from here. npm exchanges it for a short-lived
      # publishing token that belongs to this one run.
      id-token: write
    steps:
      - name: Take the package that was checked
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - name: There is one package, and it is the one that was checked
        run: |
          count="$(ls dist/*.tgz | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "there are $count packages, not one" >&2
            exit 1
          fi
          ls -l dist

      - uses: actions/setup-node@v4
        with:
          # npm exchanges the OIDC token by itself from npm 11.5.1 on, and that
          # npm needs Node 22.14.0 or newer.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # The cache of a publishing build may hold the credentials of the
          # build, so it is not used here.
          cache: ''

      - name: The npm of this job can exchange the OIDC token by itself
        run: |
          version="$(npm --version)"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 5 ]; }; then
            echo "npm $version cannot exchange the OIDC token by itself; npm 11.5.1 or newer is needed" >&2
            exit 1
          fi
          echo "npm $version"

      # The package is published as it was packed and checked; the code of the
      # repository is not in this job, and it is not run here.
      - name: Publish to npm
        # The name of the file starts with "./" on purpose: without it npm
        # reads "dist/name.tgz" as the short form of a GitHub repository
        # (owner/name) and goes looking for it over ssh.
        run: npm publish ./dist/*.tgz
